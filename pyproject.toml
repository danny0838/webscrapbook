[dependency-groups]
lint = [
    "flake8>=6.1",
    "Flake8-pyproject>=1.2.3",
    "pep8-naming>=0.13.2",
    "flake8-comprehensions>=3.8",
    "flake8-quotes>=3.4",
    "flake8-bugbear>=22.6.22",
    "flake8-isort>=5.0",
    "isort>=5.9.2",
]

[tool.flake8]
exclude = [
    ".git",
    ".tox",
    ".venv",
    "dist",
    "node_modules",
]
max-line-length = 160

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
